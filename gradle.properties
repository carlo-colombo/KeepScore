# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
# Limit concurrent workers so lint/test workers cannot each peak at once on a small runner.
org.gradle.workers.max=2
# Reuse task outcomes and run independent work in parallel.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true
android.useAndroidX=true
android.nonTransitiveRClass=true
