plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.ksp)
}

android {
    namespace = 'ovh.litapp.keepscore'
    compileSdk 36

    defaultConfig {
        applicationId "ovh.litapp.keepscore"
        minSdk 34
        targetSdk 36
        // CI passes -Pandroid.versionName/-Pandroid.versionCode derived from the release tag.
        versionCode = (findProperty("android.versionCode") ?: "28").toString().toInteger()
        versionName = (findProperty("android.versionName") ?: "1.5.1").toString()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    lint {
        // Full lint must fail the build on errors. There is no baseline any more: the migration to
        // Kotlin and Compose removed every recorded finding, so new code must keep lint clean.
        abortOnError = true
        warningsAsErrors = false
    }
}

ksp {
    // Room writes its schema JSON here; GameDBHelperMigrationTest reads them back.
    arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.androidx.core
    implementation libs.androidx.fragment
    implementation libs.androidx.viewpager2
    implementation libs.androidx.viewpager
    implementation libs.androidx.preference
    implementation libs.androidx.work.runtime
    implementation libs.androidx.room.runtime
    implementation libs.androidx.activity
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.reorderable
    debugImplementation libs.androidx.compose.ui.tooling
    implementation libs.google.material
    implementation files('libs/exp4j-0.3.11.jar')

    ksp libs.androidx.room.compiler

    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.core
    testImplementation platform(libs.androidx.compose.bom)
    testImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.test.manifest
    testImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}
