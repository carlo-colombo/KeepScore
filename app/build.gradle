plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace = 'ovh.litapp.keepscore'
    compileSdk 36

    defaultConfig {
        applicationId "ovh.litapp.keepscore"
        minSdk 34
        targetSdk 36
        // CI passes -Pandroid.versionName/-Pandroid.versionCode derived from the release tag.
        versionCode = (findProperty("android.versionCode") ?: "28").toString().toInteger()
        versionName = (findProperty("android.versionName") ?: "1.5.1").toString()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments["room.schemaLocation"] = "$projectDir/schemas"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    lint {
        // Full lint must fail the build on errors. The baseline records the pre-existing debt from
        // the legacy codebase; burn it down in later waves. Warnings stay visible.
        abortOnError = true
        warningsAsErrors = false
        baseline = file("lint-baseline.xml")
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.androidx.core
    implementation libs.androidx.fragment
    implementation libs.androidx.viewpager2
    implementation libs.androidx.viewpager
    implementation libs.androidx.preference
    implementation libs.androidx.work.runtime
    implementation libs.androidx.room.runtime
    implementation libs.androidx.activity
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    debugImplementation libs.androidx.compose.ui.tooling
    implementation libs.google.material
    implementation libs.ambilwarna
    implementation files('libs/exp4j-0.3.11.jar')

    annotationProcessor libs.androidx.room.compiler

    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.core
    testImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}
